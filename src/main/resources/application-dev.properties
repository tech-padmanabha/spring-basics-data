#datasource
spring.datasource.url=jdbc:mysql://localhost:3306/work_flow?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=sahu


#log JPA queries (should comment at production)
spring.jpa.show-sql=true


# Drop and create new tables (create, create-drop, validate, update)
# Only for testing purposes - comment this in production
spring.jpa.hibernate.ddl-auto=update

# Initialize the database schema
spring.datasource.initialization-mode=always
#spring.datasource.schema=classpath:schema.sql
spring.datasource.data=classpath:data.sql

#this configuration helping us to execute the data.sql file in initial mode
#spring.jpa.defer-datasource-initialization=true